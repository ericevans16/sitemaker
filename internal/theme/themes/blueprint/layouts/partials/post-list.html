{{define "c/post-list"}}<div class="post-list wire-frame">
    <div class="post-list-head" aria-hidden="true">
        <span>Title</span>
        <span>Date</span>
    </div>
    {{range .posts}}
    <article class="post-list-item">
        <a href="{{.URL}}">{{.Title}}</a>
        {{if .DateString}}<time datetime="{{.DateString}}">{{.DateString}}</time>{{end}}
    </article>
    {{end}}
</div>{{end}}
