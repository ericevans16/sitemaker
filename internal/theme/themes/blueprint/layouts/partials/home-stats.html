{{define "c/home-stats"}}<dl class="home-stats">
                <div class="home-stat">
                    <dt class="mono">Articles</dt>
                    <dd>{{.articles}}</dd>
                </div>
                <div class="home-stat">
                    <dt class="mono">Words</dt>
                    <dd>{{.words}}</dd>
                </div>
                <div class="home-stat">
                    <dt class="mono">Tags</dt>
                    <dd>{{if .tags}}{{.tags}}{{else}}0{{end}}</dd>
                </div>
            </dl>{{end}}
