{{define "c/post-item"}}<article class="post-item">
                        <div class="post-item-row">
                            <h3><a class="post-item-title" href="{{.URL}}">{{.Title}}</a></h3>
                            {{if .DateString}}<time datetime="{{.DateString}}">{{.DateString}}</time>{{end}}
                        </div>
                        {{if .Excerpt}}
                        <p class="excerpt">{{.Excerpt}}</p>
                        {{end}}
                        <div class="post-item-more">
                            <a href="{{.URL}}">Read{{icon "arrow-right" "post-item-more-icon"}}</a>
                        </div>
                    </article>{{end}}
